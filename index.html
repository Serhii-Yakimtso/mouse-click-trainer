<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/css/style.css" />
    <title>Mouse click</title>
  </head>
  <body>
    <main class="main">
      <section class="game-table">
        <div class="desk"></div>
        <button class="start-game btn">Click to start</button>
      </section>
      <section class="results">
        <h2>Results</h2>
        <p>Total score: <span class="total-score">0</span> points</p>
        <p>Your click's: <span class="click-counter">0</span></p>
        <p>Your best time result: <span class="best">0</span> s</p>
        <p>Your worst time result: <span class="worst">0</span> s</p>

        <ol class="list"></ol>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
